<form>
  <div class="form-group">
    <label>Challenge Window Size</label>
    <select class="form-control custom-select" name="challenge_window_size">
        <option value="sm">Small</option>
        <option value="norm" selected>Normal</option>
        <option value="lg">Large</option>
        <option value="xl">Extra Large</option>
    </select>
  </div>

  <div class="form-group">
    <label>
      Challenge Category Order Custom Function<br>
      <small class="form-text text-muted">
        Define a <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort#description" target="_blank">custom compareFn function for Array.sort()</a> 
        used to sort the challenge categories
      </small>
    </label>
    <textarea class="form-control text-monospace" name="challenge_category_order" rows="5"></textarea>
  </div>

  <div class="form-group">
    <label>
      Challenge Order Custom Function<br>
      <small class="form-text text-muted">
        Define a <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort#description" target="_blank">custom compareFn function for Array.sort()</a> 
        used to sort the challenges within categories
      </small>
    </label>
    <textarea class="form-control text-monospace" name="challenge_order" rows="5"></textarea>
  </div>

  <div>
    <div class="form-check">
      <input type="checkbox" class="form-check-input" id="use_builtin_code_highlighter" name="use_builtin_code_highlighter" checked>
      <label class="form-check-label" for="use_builtin_code_highlighter">
        Use Built-In Syntax Highlighter
      </label>
    </div>
    <small class="form-text text-muted">
      The built-in syntax highlighter is lightweight and fast but may not always correctly highlight all languages. You can disable the built-in highlighter in order to use your own.
    </small>
  </div>

  <hr class="mt-4">
  <h5>Evil Santa: Christmas Spirit</h5>

  <div class="form-group">
    <label for="spirit_scene_ext">
      Scene image file type<br>
      <small class="form-text text-muted">
        File type of the 11 story images in <code>static/spirit/scenes/</code> (stage-000 … stage-100).
      </small>
    </label>
    <select class="form-control custom-select" id="spirit_scene_ext" name="spirit_scene_ext">
      <option value="" selected>Auto-detect (recommended)</option>
      <option value="svg">svg (placeholders)</option>
      <option value="png">png</option>
      <option value="webp">webp</option>
      <option value="jpg">jpg</option>
    </select>
  </div>

  <div class="form-group">
    <label for="spirit_scene_fit">
      Scene image size<br>
      <small class="form-text text-muted">
        "Whole image with side columns" shows the full scene, never cropped, with illustrated candy-cane columns filling the space on each side (wide screens). "Fill the screen" stretches the scene across the whole width and crops its edges.
      </small>
    </label>
    <select class="form-control custom-select" id="spirit_scene_fit" name="spirit_scene_fit">
      <option value="columns" selected>Whole image with side columns</option>
      <option value="cover">Fill the screen (crops edges)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="spirit_ui_ext">
      UI image file type<br>
      <small class="form-text text-muted">
        File type of the navbar, meter, coal and wrapping-paper images in <code>static/spirit/ui/</code>.
      </small>
    </label>
    <select class="form-control custom-select" id="spirit_ui_ext" name="spirit_ui_ext">
      <option value="" selected>Auto-detect (recommended)</option>
      <option value="svg">svg (placeholders)</option>
      <option value="png">png</option>
      <option value="webp">webp</option>
      <option value="jpg">jpg</option>
    </select>
  </div>

  <div class="form-group">
    <label for="spirit_total">
      Total challenges (optional)<br>
      <small class="form-text text-muted">
        Leave empty to count the challenges players can see. Set it if some challenges are hidden behind prerequisites.
      </small>
    </label>
    <input type="number" min="0" class="form-control" id="spirit_total" name="spirit_total">
  </div>

  <div class="form-group">
    <label for="spirit_season">
      Season key<br>
      <small class="form-text text-muted">
        Change this (e.g. from "test" to "2026") to reset everyone's saved "Ignite the Spirit" progress.
      </small>
    </label>
    <input type="text" class="form-control" id="spirit_season" name="spirit_season" placeholder="default">
  </div>

  <div class="form-group">
    <label for="spirit_snow">Falling snow</label>
    <select class="form-control custom-select" id="spirit_snow" name="spirit_snow">
      <option value="true">On</option>
      <option value="false">Off</option>
    </select>
  </div>

  <button type="submit" class="btn btn-primary float-right mt-4">Update</button>
</form>
